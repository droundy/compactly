name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests all features
      run: cargo test --all-features

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      # Nightly, not stable: `imports_granularity` in rustfmt.toml is an
      # unstable option, and stable rustfmt *warns and then ignores it* rather
      # than failing. A stable `cargo fmt --check` would therefore pass on
      # unmerged imports and enforce nothing about them.
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run clippy
      run: cargo clippy --all-targets --workspace -- -D warnings
      # `benchmarking` gates the benchmark-support API and `stream` the async
      # decoder, so `benches/atmost.rs` and the bins that drive either carry
      # `required-features` for them — without this second pass cargo would
      # silently skip linting them.
    - name: Run clippy (feature-gated targets)
      run: cargo clippy --all-targets --workspace --features "benchmarking stream" -- -D warnings

  rebuild-bit-context:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Bit context unit tests
      run: cargo test --features "generate_bit_context"
    - name: Rebuild v1 bit context
      run: ./src/v1/bit-context.sh
    - name: Rebuild v2 bit context
      run: ./src/v2/bit-context.sh
    # `--exit-code` is what makes this a check: plain `git diff` prints the
    # drift and still exits 0, so regenerated output that no longer matches
    # the committed file would pass silently.
    - name: Confirm no changes to the code
      run: git diff --exit-code

  linux-test-no-default-features:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --no-default-features
    - name: Run lib tests
      run: cargo test --verbose --lib --no-default-features
    - name: Run derive tests
      run: cargo test --verbose --test derive --no-default-features

  linux-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check
      - run: cargo check --no-default-features
  wasm-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --no-default-features

  windows-test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  windows-check:
    runs-on: windows-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check

  macos-check:
    runs-on: macos-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check
