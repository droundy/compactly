[package]
name = "compactly"
version = "0.2.0"
edition = "2021"
description = "Compactly encode data types using adaptive arithmetic coding"
license = "MIT OR Apache-2.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
readme = "README.md"
repository = "https://github.com/droundy/compactly"

[features]

generate_bit_context = []
v1 = []
v2 = []
# Async decoding from a `Stream` of `Bytes` chunks: `v2::decode_stream` and the
# `AsyncRangeDecoder`/`AsyncAnsDecoder` behind it. Additive and runtime-neutral
# — `futures-core` is a zero-dependency trait crate and no executor is required.
stream = ["dep:bytes", "dep:futures-core", "v2"]
default = ["v1", "v2"]

[dependencies]

compactly-derive = { version = "=0.2.0", path = "compactly-derive" }
csv = { version = "1", optional = true }
ureq = { version = "2", optional = true }

bytes = { version = "1.12", optional = true }
futures-core = { version = "0.3", optional = true }

nonmax = { version = "0.5.5", optional = true }
uuid = { version = "1.18.1", optional = true }

[dev-dependencies]

expect-test = "1.5.1"
# The measurement harness for everything in `benches/`: functions register
# themselves, and `scaling` samples, tests for differences and prints.
# By git revision until the release after 0.9.1: the benches use `build_once`
# inputs, which the published 0.9.1 lacks. Replace with `scaling = "0.9"` (or
# whichever release has it) and delete the `git` and `rev` keys then.
scaling = { version = "0.9.1", git = "https://github.com/droundy/scaling", rev = "75261b0ae8583602c95b58313d07fd66edca016e" }
# The real-world corpora `benches/bench.rs` measures. It depends on this crate,
# which cargo allows for a dev-dependency.
comparison = { path = "comparison" }
futures-executor = "0.3"
stats_alloc = "0.1.10"
rand = { version = "0.8.5", features = ["small_rng"] }

bincode = "2.0.1"
bincode1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0", features = ["derive", "rc"] }
zstd = "0.13.2"
rapidhash = "1.4.0"
bitcode = "0.6.9"

# For `benches/support`, which fixes glibc's allocator thresholds so a benchmark
# does not depend on the heap history of the process that runs it.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
libc = "0.2"

[profile.bench]
debug = true

[workspace]

members = [
    "compactly-derive",
    "comparison"
]

[[bench]]
name = "bench"
harness = false
required-features = ["v2"]

[[bench]]
name = "strategies"
harness = false
required-features = ["v2"]

[[bin]]
name = "char-freq"
required-features = ["csv", "ureq"]

# The A/B workbench: `Ans` against `Range` across routes and workloads, and the
# questions about either coder's internals a workload table cannot ask. It needs
# only `v2`; what `stream` unlocks is registered when it is
# on and absent otherwise, so a plain `cargo bench` measures the route table
# instead of cargo silently skipping the target. See benches/coders/main.rs.

[[bench]]
name = "coders"
path = "benches/coders/main.rs"
harness = false
required-features = ["v2"]
