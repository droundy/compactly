[package]
name = "compactly"
version = "0.2.0"
edition = "2021"
description = "Compactly encode data types using adaptive arithmetic coding"
license = "MIT OR Apache-2.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
readme = "README.md"
repository = "https://github.com/droundy/compactly"

[features]

generate_bit_context = []
# Exposes the benchmark-support surface (forced tree walks, forced decoder
# instantiations, entropy-phase replay) that `benches/` drives. Off by
# default: these bypass the choices the library makes for itself, and some
# silently produce wrong answers when pointed at the wrong input. Not covered
# by semver.
benchmarking = []
v1 = []
v2 = []
# Async decoding from a `Stream` of `Bytes` chunks: `v2::decode_stream` and the
# `AsyncRangeDecoder`/`AsyncAnsDecoder` behind it. Additive and runtime-neutral
# — `futures-core` is a zero-dependency trait crate and no executor is required.
stream = ["dep:bytes", "dep:futures-core", "v2"]
default = ["v1", "v2"]

[dependencies]

compactly-derive = { version = "=0.2.0", path = "compactly-derive" }
csv = { version = "1", optional = true }
ureq = { version = "2", optional = true }

bytes = { version = "1.12", optional = true }
futures-core = { version = "0.3", optional = true }

nonmax = { version = "0.5.5", optional = true }
uuid = { version = "1.18.1", optional = true }

[dev-dependencies]

expect-test = "1.5.1"
# The measurement harness for everything in `benches/`: it times a closure
# until its standard error is small enough, and says so when it could not.
# Git rather than plain 0.9.0 until that version is published; drop the `git`
# key then, here and in comparison/Cargo.toml.
scaling = { version = "0.9.0", git = "https://github.com/droundy/scaling" }
futures-executor = "0.3"
stats_alloc = "0.1.10"
rand = { version = "0.8.5", features = ["small_rng"] }

bincode = "2.0.1"
bincode1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0", features = ["derive", "rc"] }
zstd = "0.13.2"
rapidhash = "1.4.0"
bitcode = "0.6.9"

[profile.bench]
debug = true

[workspace]

members = [
    "compactly-derive",
    "comparison"
]

[[bench]]
name = "bench"
harness = false
required-features = ["v1", "v2"]

[[bench]]
name = "integers"
harness = false
required-features = ["v2"]

[[bench]]
name = "signed"
harness = false
required-features = ["v2"]

[[bench]]
name = "bytes"
harness = false
required-features = ["v2"]

[[bench]]
name = "atmost"
harness = false
required-features = ["v2", "benchmarking"]

[[bin]]
name = "char-freq"
required-features = ["csv", "ureq"]

# The workload benchmarks. All are `harness = false` plain `main`s that take
# arguments — `cargo bench --bench coder-routes -- strings ans slice`, or run
# the executable `cargo bench --no-run` reports. `benchmarking` gets them the
# forced walks and decoders; each also has a default arm, so
# `cargo bench --all-features` — which runs them all with no arguments —
# measures something rather than printing usage and failing.

[[bench]]
name = "coder-routes"
harness = false
required-features = ["v2", "stream", "benchmarking"]

[[bench]]
name = "micro-batch"
harness = false
required-features = ["v2", "benchmarking"]

[[bench]]
name = "ans-phases"
harness = false
required-features = ["v2", "benchmarking"]

[[bench]]
name = "ans-chunk-tracking"
harness = false
required-features = ["v2", "benchmarking"]

[[bench]]
name = "async-decode-overlap"
harness = false
required-features = ["v2", "stream", "benchmarking"]

[[bench]]
name = "bench-arc-str"
harness = false
required-features = ["v2", "benchmarking"]
