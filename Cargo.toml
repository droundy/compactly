[package]
name = "compactly"
version = "0.2.0"
edition = "2021"
description = "Compactly encode data types using adaptive arithmetic coding"
license = "MIT OR Apache-2.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
readme = "README.md"

[features]

generate_bit_context = []
# Exposes the benchmark-support surface (forced tree walks, forced decoder
# instantiations, entropy-phase replay) that `benches/` and `src/bin/` drive.
# Off by default: these bypass the choices the library makes for itself, and
# some silently produce wrong answers when pointed at the wrong input. Not
# covered by semver.
benchmarking = []
v1 = []
v2 = []
default = ["v1", "v2"]

[dependencies]

compactly-derive = { version = "=0.2.0", path = "compactly-derive" }
csv = { version = "1", optional = true }
ureq = { version = "2", optional = true }

nonmax = { version = "0.5.5", optional = true }
uuid = { version = "1.18.1", optional = true }

[dev-dependencies]

expect-test = "1.5.1"
scaling = "0.1.3"
stats_alloc = "0.1.10"
rand = { version = "0.8.5", features = ["small_rng"] }

bincode = "2.0.1"
bincode1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0", features = ["derive", "rc"] }
zstd = "0.13.2"
rapidhash = "1.4.0"
bitcode = "0.6.9"

[profile.bench]
debug = true

[workspace]

members = [
    "compactly-derive",
    "comparison"
]

[[bench]]
name = "bench"
harness = false
required-features = ["v1", "v2"]

[[bench]]
name = "integers"
harness = false
required-features = ["v2"]

[[bench]]
name = "signed"
harness = false
required-features = ["v2"]

[[bench]]
name = "bytes"
harness = false
required-features = ["v2"]

[[bench]]
name = "atmost"
harness = false
required-features = ["v2", "benchmarking"]

# These binaries use the v2 API, so they cannot build without it.
[[bin]]
name = "just-compress"
required-features = ["v2"]

[[bin]]
name = "just-decompress"
required-features = ["v2"]

[[bin]]
name = "range-decode-collapse"
required-features = ["v2"]

[[bin]]
name = "just-decompress-floats"
required-features = ["v2"]

[[bin]]
name = "just-decompress-net"
required-features = ["v2"]

[[bin]]
name = "just-decompress-strings"
required-features = ["v2"]

[[bin]]
name = "just-compress-strings"
required-features = ["v2"]

[[bin]]
name = "just-compress-enums"
required-features = ["v2"]

[[bin]]
name = "just-decompress-enums"
required-features = ["v2"]

[[bin]]
name = "just-decompress-uless"
required-features = ["v2"]

[[bin]]
name = "micro-batch"
required-features = ["v2"]

[[bin]]
name = "char-freq"
required-features = ["csv", "ureq"]

[[bin]]
name = "ans-decode-phases"
required-features = ["v2", "benchmarking"]

[[bin]]
name = "ans-encode-phases"
required-features = ["v2"]


[[bin]]
name = "just-decompress-compressible"
required-features = ["v2"]

[[bin]]
name = "just-decompress-stream"
required-features = ["v2", "benchmarking"]
