[package]
name = "compactly"
version = "0.2.0"
edition = "2021"
description = "Compactly encode data types using adaptive arithmetic coding"
license = "MIT OR Apache-2.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
readme = "README.md"
repository = "https://github.com/droundy/compactly"

[features]

generate_bit_context = []
# Exposes the benchmark-support surface (forced tree walks, forced decoder
# instantiations, entropy-phase replay) that `benches/` and `src/bin/` drive,
# and pulls in `scaling`, which every benchmark binary times itself with.
# Off by default: these bypass the choices the library makes for itself, and
# some silently produce wrong answers when pointed at the wrong input. Not
# covered by semver.
benchmarking = ["dep:scaling"]
v1 = []
v2 = []
# Async decoding from a `Stream` of `Bytes` chunks: `v2::decode_stream` and the
# `AsyncRangeDecoder`/`AsyncAnsDecoder` behind it. Additive and runtime-neutral
# — `futures-core` is a zero-dependency trait crate and no executor is required.
stream = ["dep:bytes", "dep:futures-core", "v2"]
default = ["v1", "v2"]

[dependencies]

compactly-derive = { version = "=0.2.0", path = "compactly-derive" }
csv = { version = "1", optional = true }
ureq = { version = "2", optional = true }

bytes = { version = "1.12", optional = true }
futures-core = { version = "0.3", optional = true }

# The measurement harness for everything in `src/bin/`: it times a closure
# until its standard error is small enough and says so when it could not. A
# dev-dependency would not reach `src/bin` (only benches, tests and examples
# see those), so it is an optional *normal* dependency switched on by the
# `benchmarking` feature. Git rather than plain 0.9.0 until that is published;
# drop the `git` key then, here and in dev-dependencies.
scaling = { version = "0.9.0", git = "https://github.com/droundy/scaling", optional = true }

nonmax = { version = "0.5.5", optional = true }
uuid = { version = "1.18.1", optional = true }

[dev-dependencies]

expect-test = "1.5.1"
scaling = { version = "0.9.0", git = "https://github.com/droundy/scaling" }
futures-executor = "0.3"
stats_alloc = "0.1.10"
rand = { version = "0.8.5", features = ["small_rng"] }

bincode = "2.0.1"
bincode1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0", features = ["derive", "rc"] }
zstd = "0.13.2"
rapidhash = "1.4.0"
bitcode = "0.6.9"

[profile.bench]
debug = true

[workspace]

members = [
    "compactly-derive",
    "comparison"
]

[[bench]]
name = "bench"
harness = false
required-features = ["v1", "v2"]

[[bench]]
name = "integers"
harness = false
required-features = ["v2"]

[[bench]]
name = "signed"
harness = false
required-features = ["v2"]

[[bench]]
name = "bytes"
harness = false
required-features = ["v2"]

[[bench]]
name = "atmost"
harness = false
required-features = ["v2", "benchmarking"]

# The benchmark binaries: `v2` for the API they measure, `benchmarking` for
# `scaling` (which times them) and for the forced walks and decoders some of
# them drive.
[[bin]]
name = "ans-phases"
required-features = ["v2", "benchmarking"]

[[bin]]
name = "ans-chunk-tracking"
required-features = ["v2", "benchmarking"]

[[bin]]
name = "micro-batch"
required-features = ["v2", "benchmarking"]

[[bin]]
name = "char-freq"
required-features = ["csv", "ureq"]

[[bin]]
name = "coder-routes"
required-features = ["v2", "stream", "benchmarking"]

[[bin]]
name = "async-decode-overlap"
required-features = ["v2", "stream", "benchmarking"]

# Times itself with `scaling`, and uses the v2 API throughout.
[[bin]]
name = "bench-arc-str"
required-features = ["v2", "benchmarking"]
