# Align every function to a cache line, so that where the compiler happens to
# place code stops being a cause of differences between builds: two builds of
# identical source can otherwise time tens of percent apart (see scaling's README,
# "Very fast functions, and where the code sits", and OPTIMIZING.md). Not
# published, so it affects only builds of this workspace. Note that a `RUSTFLAGS`
# environment variable replaces this, and so would a `rustflags` set under the
# `[target...]` section below.
[build]
rustflags = ["-C", "llvm-args=-align-all-functions=6"]

[target.x86_64-unknown-linux-gnu]
