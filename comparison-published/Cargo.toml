# `comparison`, built against the last *published* compactly instead of this
# checkout, so a bench can encode the same corpus with both and compare them.
#
# The derive emits `compactly::…` paths, so a corpus type works only in a crate
# whose own dependency is named `compactly`. A rename on the bench crate's edge
# cannot do it; this twin has its own `compactly`, from the registry. Bump the
# `=` pin when a new release comes out.
[package]
name = "comparison-published"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0.217", features = ["derive", "rc"] }
compactly = { version = "=0.2.0" }
serde_json = "1.0.138"
csv = "1.3.1"
